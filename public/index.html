<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="theme-color" content="#455d3b">
	<!-- PWA identity: manifest + icons enable add-to-homescreen, which on
	     iOS (16.4+) is the prerequisite for web push. Icons generated by
	     scripts/gen-icons.js (run once). -->
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Flanit">
	<link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
	<!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
	<title>Flanit — find a place, together</title>
	<meta name="description" content="Swipe, match and decide where to go — together. The app to discover your city with friends.">
	<!-- Default social / link preview (Open Graph + Twitter). Per-link dynamic
	     previews for /v /s /u are a later serverless step; this is the branded
	     fallback every flanit.co link gets. -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Flanit">
	<meta property="og:title" content="Discover your city with friends">
	<meta property="og:description" content="Swipe, match and decide where to go — together.">
	<meta property="og:url" content="https://flanit.co">
	<meta property="og:image" content="https://flanit.co/og-default.png">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Discover your city with friends">
	<meta name="twitter:description" content="Swipe, match and decide where to go — together.">
	<meta name="twitter:image" content="https://flanit.co/og-default.png">
	<!-- Tailwind is now compiled at build time (tailwind.config.js) — the CDN
	     runtime compiler is gone; it cost slow phones seconds per load. -->
	<!-- On-phone debug console: open flanit.co/?flanitdebug=1 on any device to
	     get an in-page console (Eruda) — the only way to read iPhone logs
	     without a Mac. Does nothing unless the param is present. -->
	<script>
		if (window.location.search.indexOf("flanitdebug") !== -1) {
			var erudaScript = document.createElement("script");
			erudaScript.src = "https://cdn.jsdelivr.net/npm/eruda";
			erudaScript.onload = function () { window.eruda && window.eruda.init(); };
			document.head.appendChild(erudaScript);
		}
	</script>
</head>

<body>
	<noscript>
		You need to enable JavaScript to run this app.
	</noscript>
	<div id="root"></div>
	<!--

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
